<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Recognition Door — Web</title>
<style>
  :root{
    --bg:#070b14; --bg-card:#0d1524; --bg-input:#111c30; --border:#1e2f4a;
    --text:#e2e8f0; --muted:#64748b; --accent:#22d3ee; --green:#22c55e;
    --red:#ef4444; --amber:#f59e0b; --blue:#3b82f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  header{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:18px}
  .logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#22d3ee);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 18px rgba(34,211,238,.35)}
  h1{font-size:20px;letter-spacing:.5px}
  .sub{font-family:Consolas,monospace;font-size:11px;color:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 300px;gap:18px}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px}
  .video-wrap{position:relative;border:2px solid var(--border);border-radius:12px;overflow:hidden;background:#000;transition:border-color .3s}
  .video-wrap.granted{border-color:var(--green)} .video-wrap.denied{border-color:var(--red)}
  .video-wrap.scanning{border-color:var(--accent)}
  video,canvas.overlay{width:100%;display:block;transform:scaleX(-1)}
  canvas.overlay{position:absolute;inset:0}
  .pill{display:inline-flex;align-items:center;gap:8px;font-family:Consolas,monospace;font-size:12px;font-weight:bold;padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--bg-input);color:var(--muted);margin-top:12px}
  .pill.granted{color:var(--green);border-color:var(--green)} .pill.denied,.pill.unknown{color:var(--red);border-color:var(--red)}
  .pill.verifying{color:var(--amber);border-color:var(--amber)}
  .msg{margin-top:10px;color:var(--muted);min-height:22px}
  /* ---- door ---- */
  .door-card{display:flex;flex-direction:column;align-items:center}
  .door-frame{width:200px;height:280px;perspective:900px;position:relative;margin:10px 0}
  .door-wall{position:absolute;inset:0;background:#1a2740;border:3px solid #2c4066;border-radius:8px}
  .door-open-space{position:absolute;inset:6px;background:radial-gradient(circle at 50% 40%,#0b3d2e,#04120c);border-radius:4px;overflow:hidden}
  .glow{position:absolute;inset:0;opacity:0;background:radial-gradient(circle,rgba(34,197,94,.55),transparent 70%);transition:opacity .6s}
  .door-frame.open .glow{opacity:1}
  .leaf{position:absolute;top:6px;width:calc(50% - 7px);height:calc(100% - 12px);background:linear-gradient(160deg,#243b63,#16233c);border:2px solid #3b5580;transition:transform 1.1s cubic-bezier(.6,.05,.28,.97);z-index:2}
  .leaf::after{content:"";position:absolute;top:18%;left:20%;right:20%;height:28%;border:2px solid #3b5580;border-radius:6px}
  .leaf.left{left:6px;transform-origin:left center;box-shadow:inset -8px 0 14px rgba(0,0,0,.45)}
  .leaf.right{right:6px;transform-origin:right center;box-shadow:inset 8px 0 14px rgba(0,0,0,.45)}
  .door-frame.open .leaf.left{transform:rotateY(-78deg)}
  .door-frame.open .leaf.right{transform:rotateY(78deg)}
  .knob{position:absolute;top:52%;width:9px;height:9px;border-radius:50%;background:#f0c14b;box-shadow:0 0 6px rgba(240,193,75,.8)}
  .leaf.left .knob{right:8px} .leaf.right .knob{left:8px}
  .door-frame.denied{animation:shake .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .door-label{font-family:Consolas,monospace;font-size:11px;color:var(--muted)}
  /* ---- controls ---- */
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button{font:inherit;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;background:var(--bg-input);color:var(--text);border:1px solid var(--border)}
  button:hover{filter:brightness(1.15)}
  button.primary{background:linear-gradient(135deg,#0ea5e9,#22d3ee);color:#04212b;border:0}
  button.danger{background:#3b1218;color:#fca5a5;border-color:#7f1d1d}
  button.green{background:linear-gradient(135deg,#15803d,#22c55e);color:#052e16;border:0}
  button:disabled{opacity:.45;cursor:not-allowed}
  input[type=text]{width:100%;font:inherit;background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:6px}
  label.small{font-family:Consolas,monospace;font-size:10px;color:var(--accent);letter-spacing:1px}
  .users{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{display:flex;align-items:center;gap:8px;background:var(--bg-input);border:1px solid var(--border);border-radius:999px;padding:5px 8px 5px 12px;font-size:13px}
  .chip button{padding:2px 8px;border-radius:999px;font-size:12px;color:#fca5a5;background:#3b1218;border:0}
  .bar{height:8px;background:var(--bg-input);border-radius:999px;overflow:hidden;margin-top:10px;border:1px solid var(--border)}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0ea5e9,#22d3ee);transition:width .25s}
  footer{margin-top:22px;text-align:center;font-family:Consolas,monospace;font-size:11px;color:#3d5478}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🚪</div>
    <div>
      <h1>FACE RECOGNITION DOOR</h1>
      <div class="sub">SMART LOCK SYSTEM // WEB EDITION</div>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <div class="video-wrap" id="videoWrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas class="overlay" id="overlay"></canvas>
      </div>
      <div class="pill" id="pill">● CAMERA OFF</div>
      <div class="msg" id="msg">Start the scanner or register a new face.</div>
      <div class="btns">
        <button class="primary" id="btnScan">▶ Start Scanner</button>
        <button id="btnStop" disabled>■ Stop</button>
        <button id="btnVoice" title="Test the voice">🔊 Test Voice</button>
      </div>
    </div>

    <div>
      <div class="card door-card">
        <label class="small">DOOR STATUS</label>
        <div class="door-frame" id="door">
          <div class="door-wall"></div>
          <div class="door-open-space"><div class="glow"></div></div>
          <div class="leaf left"><div class="knob"></div></div>
          <div class="leaf right"><div class="knob"></div></div>
        </div>
        <div class="door-label" id="doorLabel">LOCKED</div>
      </div>

      <div class="card" style="margin-top:14px">
        <label class="small">REGISTER NEW FACE</label>
        <input type="text" id="regName" placeholder="Enter unique name" maxlength="30">
        <div class="bar"><i id="regBar"></i></div>
        <div class="msg" id="regHint" style="margin-top:6px">Enter a name and hold your face steady.</div>
        <div class="btns" style="margin-top:8px">
          <button class="green" id="btnReg">Capture Samples</button>
          <button id="btnRegCancel" disabled>Cancel</button>
        </div>
      </div>

      <div class="card" style="margin-top:14px">
        <label class="small">REGISTERED USERS</label>
        <div class="users" id="users"><span style="color:var(--muted);font-size:13px">Loading…</span></div>
      </div>
    </div>
  </div>

  <footer>OpenCV • LBPH • Haar Cascade • Flask • getUserMedia</footer>
</div>

<script>
const video=document.getElementById("video"),overlay=document.getElementById("overlay"),
  octx=overlay.getContext("2d"),wrap=document.getElementById("videoWrap"),
  pill=document.getElementById("pill"),msg=document.getElementById("msg"),
  door=document.getElementById("door"),doorLabel=document.getElementById("doorLabel"),
  btnScan=document.getElementById("btnScan"),btnStop=document.getElementById("btnStop"),
  btnReg=document.getElementById("btnReg"),btnRegCancel=document.getElementById("btnRegCancel"),
  regName=document.getElementById("regName"),regBar=document.getElementById("regBar"),
  regHint=document.getElementById("regHint"),usersEl=document.getElementById("users");

let stream=null,loopTimer=null,mode="idle",lastState="idle";
const canvas=document.createElement("canvas");
const GRANT_STATES=["granted"];

function setPill(text,cls=""){pill.className="pill "+cls;pill.textContent="● "+text}
function setMsg(t){msg.textContent=t}

/* ---- speech: browser voice first (works online), fallback to server pyttsx3 ---- */
let voices=[];
function loadVoices(){voices=(speechSynthesis&&speechSynthesis.getVoices())||[]}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}

function unlockSpeech(){
  if(!("speechSynthesis" in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}
}

function speak(text){
  // 1) browser voice — works on live/online deployments
  if("speechSynthesis" in window){
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.rate=1.05;u.pitch=1;u.volume=1;u.lang="en-US";
      const v=voices.find(v=>/en[-_]US/i.test(v.lang)&&/google|natural|zira|david|aria|jenny/i.test(v.name))
            ||voices.find(v=>/google/i.test(v.name)&&/en/i.test(v.lang))
            ||voices.find(v=>/^en/i.test(v.lang));
      if(v)u.voice=v;
      u.onerror=()=>serverSpeak(text);   // browser failed → server voice
      speechSynthesis.speak(u);
      return;
    }catch(e){}
  }
  serverSpeak(text);
}
function serverSpeak(text){
  // 2) server pyttsx3 — plays on the host PC (local runs)
  fetch("/api/speak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})}).catch(()=>{});
}

function openDoor(){door.classList.add("open");doorLabel.textContent="OPEN — WELCOME";doorLabel.style.color="var(--green)"}
function closeDoor(){door.classList.remove("open");doorLabel.textContent="LOCKED";doorLabel.style.color="var(--muted)"}
function denyDoor(){door.classList.remove("open");door.classList.add("denied");doorLabel.textContent="ACCESS DENIED";doorLabel.style.color="var(--red)";
  setTimeout(()=>door.classList.remove("denied"),500)}

async function loadUsers(){
  const r=await fetch("/api/users");const d=await r.json();
  usersEl.innerHTML="";
  if(!d.users.length){usersEl.innerHTML='<span style="color:var(--muted);font-size:13px">No users yet — register your first face.</span>';return}
  for(const u of d.users){
    const chip=document.createElement("span");chip.className="chip";
    chip.innerHTML=`${u.name} <small style="color:var(--muted)">(${u.count})</small> `;
    const b=document.createElement("button");b.textContent="✕";b.title="Delete user";
    b.onclick=async()=>{if(!confirm(`Delete '${u.name}' and retrain the model?`))return;
      const res=await fetch("/api/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:u.name})});
      const dd=await res.json();alert(dd.error||`Deleted. ${dd.users.length} user(s) remaining.`);loadUsers()};
    chip.appendChild(b);usersEl.appendChild(chip);
  }
}

async function startCamera(){
  if(stream)return;
  stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play();
  overlay.width=video.videoWidth||640;overlay.height=video.videoHeight||480;
}

function grabFrame(){
  const w=video.videoWidth,h=video.videoHeight;
  if(!w||!h)return null;
  canvas.width=w;canvas.height=h;
  const c=canvas.getContext("2d");
  c.translate(w,0);c.scale(-1,1);            // mirror to match displayed video
  c.drawImage(video,0,0,w,h);
  return canvas.toDataURL("image",0.72).split(",")[1];
}

function drawBoxes(faces,frameW,frameH,colorOk="#22d3ee",colorBad="#ef4444"){
  const w=overlay.width,h=overlay.height;
  octx.clearRect(0,0,w,h);
  if(!faces||!frameW)return;
  const sx=w/frameW,sy=h/frameH;
  for(const f of faces){
    const x=f.x*sx,y=f.y*sy,fw=f.w*sx,fh=f.h*sy;
    const col=f.ok?colorOk:colorBad;
    octx.strokeStyle=col;octx.lineWidth=2;octx.strokeRect(x,y,fw,fh);
    octx.lineWidth=4;
    const L=Math.min(22,fw*0.3);
    octx.beginPath();
    octx.moveTo(x,y+L);octx.lineTo(x,y);octx.lineTo(x+L,y);
    octx.moveTo(x+fw-L,y);octx.lineTo(x+fw,y);octx.lineTo(x+fw,y+L);
    octx.moveTo(x,y+fh-L);octx.lineTo(x,y+fh);octx.lineTo(x+L,y+fh);
    octx.moveTo(x+fw-L,y+fh);octx.lineTo(x+fw,y+fh);octx.lineTo(x+fw,y+fh-L);
    octx.stroke();
    octx.font="bold 14px Consolas";octx.fillStyle=col;
    const tag=(f.label&&f.ok)?f.label:(f.ok?"MATCH":"FACE");
    octx.fillText(tag,x,y-6);
  }
}

async function scanLoop(){
  const img=grabFrame();
  if(!img){loopTimer=setTimeout(scanLoop,300);return}
  try{
    const r=await fetch("/api/recognize",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:img})});
    const d=await r.json();
    // put the recognized name on the face box
    if(d.faces)for(const f of d.faces){if(f.ok&&d.name)f.label=d.name}
    drawBoxes(d.faces,d.width,d.height);
    setMsg(d.message||"");
    const cls=d.state==="granted"?"granted":d.state==="denied"||d.state==="unknown"?"denied":d.state==="verifying"?"verifying":"scanning";
    setPill((d.state==="granted"?"GRANTED · "+(d.name||"").toUpperCase():d.state||"scanning").toUpperCase(),cls);
    wrap.className="video-wrap "+cls;
    if(d.state==="granted"&&lastState!=="granted"){
      openDoor();
      setMsg("✅ Access Granted — Welcome, "+d.name+"!");
      speak("Welcome, "+d.name);
    }else if(d.state==="granted"){
      // keep greeting visible while the door is open
      setMsg("✅ Welcome, "+d.name+" — door is open.");
      doorLabel.textContent="OPEN — WELCOME, "+(d.name||"").toUpperCase();
    }
    if(d.state==="denied"&&lastState!=="denied"){denyDoor();speak("Access denied.")}
    if(d.state==="idle"){closeDoor()}
    lastState=d.state;
  }catch(e){}
  loopTimer=setTimeout(scanLoop,300);
}

async function regLoop(){
  const img=grabFrame();
  if(!img){loopTimer=setTimeout(regLoop,300);return}
  try{
    const r=await fetch("/api/register/frame",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:img})});
    const d=await r.json();
    if(d.error){regHint.textContent=d.error;stopReg(false);return}
    drawBoxes(d.faces,d.width,d.height);
    regHint.textContent=d.hint;
    regBar.style.width=(100*d.captured/d.total)+"%";
    if(d.done){
      regHint.textContent=`✔ ${regName.value.trim()} registered! Trained on ${d.trained.users} user(s), ${d.trained.images} images.`;
      speak("Registration complete.");
      stopReg(false);loadUsers();closeDoor();
      return;
    }
  }catch(e){}
  loopTimer=setTimeout(regLoop,250);
}

async function startScanner(){
  try{await startCamera()}catch(e){alert("Camera not available: "+e.message);return}
  unlockSpeech();speak("Scanner started");   // unlock voice on the button click itself
  mode="scan";btnScan.disabled=true;btnReg.disabled=true;btnStop.disabled=false;btnRegCancel.disabled=true;
  octx.clearRect(0,0,overlay.width,overlay.height);
  setPill("SCANNING","scanning");setMsg("Point your face at the camera…");
  scanLoop();
}
function stopScanner(){
  mode="idle";clearTimeout(loopTimer);
  btnScan.disabled=false;btnReg.disabled=false;btnStop.disabled=true;
  setPill("CAMERA OFF");setMsg("Scanner stopped.");closeDoor();
  octx.clearRect(0,0,overlay.width,overlay.height);
  fetch("/api/recognize/reset",{method:"POST"});
}

async function startReg(){
  const name=regName.value.trim();
  if(!name){alert("Please enter a name.");return}
  try{await startCamera()}catch(e){alert("Camera not available: "+e.message);return}
  unlockSpeech();
  const r=await fetch("/api/register/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});
  const d=await r.json();
  if(d.error){alert(d.error);return}
  mode="reg";btnReg.disabled=true;btnScan.disabled=true;btnStop.disabled=true;btnRegCancel.disabled=false;regName.disabled=true;
  regBar.style.width=(100*d.captured/d.total)+"%";
  regHint.textContent="Capturing… hold still";
  regLoop();
}
async function stopReg(cancelServer=true){
  if(cancelServer)await fetch("/api/register/cancel",{method:"POST"});
  clearTimeout(loopTimer);mode="idle";
  btnReg.disabled=false;btnScan.disabled=false;btnStop.disabled=true;btnRegCancel.disabled=true;regName.disabled=false;
  octx.clearRect(0,0,overlay.width,overlay.height);
}

btnScan.onclick=startScanner;btnStop.onclick=stopScanner;
btnReg.onclick=startReg;btnRegCancel.onclick=()=>stopReg(true);
document.getElementById("btnVoice").onclick=()=>{unlockSpeech();speak("Voice is working. Welcome.")};
loadUsers();
</script>
</body>
</html>
